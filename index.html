<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Contadoria dos JEFs- PE (Triagem)</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

<style>

body{
    font-size: 14px; 
    font-family:Arial;
    background:#ddd;
    margin:0;
}

header{
    background:#1565c0;
    color:white;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
}

header img{
    height:50px;
    background:white;
    padding:3px;
    border-radius:5px;
}

.container{padding:10px;}

#drop{
    border:2px dashed #aaa;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
    cursor:pointer;
}

/* FILTROS */
.filtros-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.filtro{
    background:#eee;
    padding:10px;
    border:1px solid #bbb;
}

.filtro b {
    display: inline-block;
    margin-bottom: 15px; 
}

.filtro button{
    margin:3px;
    padding:5px;
    background:#ccc;
    border:none;
    cursor:pointer;
}

.filtro button.active{
    background:#2196f3;
    color:white;
}

/* Botões de controle (selecionar todos/limpar) */
.btn-controle {
    background:#4CAF50;
    color:white;
    font-size:11px;
    padding:3px 8px;
    margin-left:5px;
    border:none;
    cursor:pointer;
    border-radius:3px;
}

.btn-controle:hover {
    background:#45a049;
}

.btn-limpar-filtro {
    background:#f44336;
    color:white;
    font-size:11px;
    padding:3px 8px;
    margin-left:5px;
    border:none;
    cursor:pointer;
    border-radius:3px;
}

.btn-limpar-filtro:hover {
    background:#da190b;
}

/* COLUNAS */
.colunas{
    background:white;
    padding:10px;
    margin-top:10px;
}

/* TABELA */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

th{
    background:#64b5f6;
    color:white;
}

td,th{
    border:1px solid #999;
    padding: 10px; 
    text-align: left;
}

tbody tr:nth-child(even){background:#f1f1f1;}
tbody tr:nth-child(odd){background:white;}

button{
    margin:5px;
    padding:8px;
}

/* Estilo para o botão de limpar ficar destacado (opcional) */
.btn-limpar {
    background-color: #ff5252;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.btn-limpar:hover {
    background-color: #d50000;
}

/* Botão Excel */
.btn-excel {
    background-color: #217346;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
.btn-excel:hover {
    background-color: #1a5c38;
}

/* Botão discreto de copiar processo */
.btn-copiar-proc {
    cursor: pointer;
    font-size: 13px;
    margin-left: 6px;
    opacity: 0.3;
    transition: opacity 0.2s ease-in-out;
}
.btn-copiar-proc:hover {
    opacity: 1;
}

</style>
</head>

<body>

<header>
    <h3>Sistema de Filtragem Contadoria Judicial - Justiça Federal em Pernambuco</h3>
</header>

<div class="container">

    <div id="drop">Arraste o CSV aqui ou clique</div>
    <input type="file" id="file" hidden>

    <button onclick="gerarPDF()">📄 Gerar PDF</button>
    <button onclick="salvarJSON()">💾 Salvar JSON</button>
    <button onclick="carregarJSON()">📂 Carregar JSON</button>
    <button class="btn-excel" onclick="exportarExcel()">📊 Exportar Excel</button>
    <button class="btn-limpar" onclick="limparDados()">🗑️ Limpar Dados</button>

    <h3>Total filtrado: <span id="total">0</span></h3>

    <div class="colunas">
        <b>Colunas:</b><br><br>
        <label><input type="checkbox" checked id="c1" onchange="render()"> Processo</label>
        <label><input type="checkbox" id="c2" onchange="render()"> Autor</label>
        <label><input type="checkbox" checked id="c3" onchange="render()"> Réu</label>
        <label><input type="checkbox" checked id="c4" onchange="render()"> Órgão</label>
        <label><input type="checkbox" checked id="c5" onchange="render()"> Data</label>
        <label><input type="checkbox" checked id="c6" onchange="render()"> Assunto</label>
        <label><input type="checkbox" id="c7" onchange="render()"> Etiqueta</label>
        <label><input type="checkbox" id="c8" onchange="render()"> Dias</label>
    </div>

    <div id="filtros" class="filtros-grid"></div>

    <table>
        <thead></thead>
        <tbody></tbody>
    </table>

</div>

<script>

let dados=[];
let filtrados=[];
let filtros={mes:[],orgao:[],etiqueta:[],assunto:[],reu:[]};

// ================= LIMPAR DADOS
function limparDados(){
    // Zera as variáveis de dados e filtros
    dados = [];
    filtrados = [];
    filtros = {mes:[],orgao:[],etiqueta:[],assunto:[],reu:[]};

    // Limpa a tela (filtros, tabela e total)
    document.getElementById("filtros").innerHTML = "";
    document.querySelector("thead").innerHTML = "";
    document.querySelector("tbody").innerHTML = "";
    document.getElementById("total").innerText = "0";

    // Reseta o input de arquivo (permite subir o mesmo arquivo de novo)
    document.getElementById("file").value = "";
}

// ================= DROP
const drop=document.getElementById("drop");
const file=document.getElementById("file");

drop.onclick=()=>file.click();
drop.ondragover=e=>e.preventDefault();
drop.ondrop=e=>{
    e.preventDefault();
    processar(e.dataTransfer.files[0]);
};

file.onchange=e=>processar(e.target.files[0]);

// ================= CSV
function processar(f){
    // Se o usuário clicar em cancelar na hora de escolher arquivo
    if(!f) return; 

    let reader=new FileReader();
    reader.onload=e=>{
        let linhas=e.target.result.split("\n").map(l=>l.replaceAll('"',''));
        dados=linhas.slice(1).map(l=>{
            let c=l.split(";");
            // Evita erro em linhas vazias no final do CSV
            if(c.length < 2) return null; 

            return{
                proc:c[5],
                autor:c[2],
                reu:c[3],
                orgao:c[8],
                data:c[9],
                mes:(c[9]||"").split("/")[1],
                assunto:c[22],
                etiqueta:(c[14]||"").split(",").map(e=>e.trim()).filter(e=>e),
                dias:parseInt(c[29])||0,
                _riscado: false // Inicializa controle da caixa de seleção
            };
        }).filter(d => d !== null); // Remove linhas vazias
        aplicar();
    };
    reader.readAsText(f);
}

// ================= BASE DINÂMICA
function base(ignorarFiltro = null){
    return dados.filter(d=>
        (ignorarFiltro === 'mes' || !filtros.mes.length || filtros.mes.includes(d.mes)) &&
        (ignorarFiltro === 'orgao' || !filtros.orgao.length || filtros.orgao.includes(d.orgao)) &&
        (ignorarFiltro === 'assunto' || !filtros.assunto.length || filtros.assunto.includes(d.assunto)) &&
        (ignorarFiltro === 'reu' || !filtros.reu.length || filtros.reu.includes(d.reu)) &&
        (ignorarFiltro === 'etiqueta' || !filtros.etiqueta.length || filtros.etiqueta.some(e=>d.etiqueta.includes(e)))
    );
}

// ================= FILTROS
function criarFiltros(){
    let meses=[...new Set(dados.map(d=>d.mes))].sort(); // Mês sempre lista todos do arquivo
    let orgaos=[...new Set(base('orgao').map(d=>d.orgao))];
    let assuntos=[...new Set(base('assunto').map(d=>d.assunto))].sort();
    let reus=[...new Set(base('reu').map(d=>d.reu))].sort();

    let etiquetasSet=new Set();
    base('etiqueta').forEach(d=>d.etiqueta.forEach(e=>etiquetasSet.add(e)));

    let servidor=[], outros=[];
    [...etiquetasSet].forEach(e=>{
        if(e.toLowerCase().includes("servidor")||e.toLowerCase().includes("supervis")){
            servidor.push(e);
        }else{
            outros.push(e);
        }
    });

    servidor.sort();
    outros.sort();

    let baseContagem = base('etiqueta');

    let servidorHtml = servidor.map(v => {
        let qtd = baseContagem.filter(d => d.etiqueta.includes(v)).length;
        let ativo = filtros["etiqueta"].includes(v) ? "active" : "";
        return `
            <div style="display: inline-block; text-align: center; margin: 3px;">
                <button class="${ativo}" style="margin: 0; margin-bottom: 2px;" onclick="toggle('etiqueta','${v}',this)">${v}</button><br>
                <span style="color: darkblue; font-size: 12px; font-weight: bold;">${qtd}</span>
            </div>
        `;
    }).join("");

    let btnSelectAllMes = `<button class="btn-controle" onclick="selecionarTodos('mes')" title="Selecionar todos os meses">✓ Todos</button>`;
    let btnLimparMes = `<button class="btn-limpar-filtro" onclick="limparFiltroEspecifico('mes')" title="Limpar filtro de mês">🧹 Limpar</button>`;
    
    let btnSelectAllServ = `<button class="btn-controle" onclick="selecionarTodos('servidor')" title="Selecionar todos os servidores">✓ Todos</button>`;
    let btnLimparServ = `<button class="btn-limpar-filtro" onclick="limparFiltroEspecifico('servidor')" title="Limpar filtro de servidores">🧹 Limpar</button>`;

    document.getElementById("filtros").innerHTML=`
        <div class="filtro">
            <b>Mês</b> ${btnSelectAllMes} ${btnLimparMes}<br>
            ${meses.map(v=>btn("mes",v)).join("")}
        </div>
        <div class="filtro">
            <b>Órgão</b><br>
            ${orgaos.map(v=>btn("orgao",v)).join("")}
        </div>
        <div class="filtro">
            <b>Servidor / Supervisão</b> ${btnSelectAllServ} ${btnLimparServ}<br>
            ${servidorHtml}
        </div>
        <div class="filtro">
            <b>Outras etiquetas</b><br>
            ${outros.map(v=>btn("etiqueta",v)).join("")}
        </div>
        <div class="filtro" style="grid-column: span 2;">
            <b>Polo Passivo / Réu</b><br>
            ${reus.map(v=>btn("reu",v)).join("")}
        </div>
        <div class="filtro" style="grid-column: span 2;">
            <b>Assunto</b><br>
            ${assuntos.map(v=>btn("assunto",v)).join("")}
        </div>
    `;
}

// ================= BOTÕES
function btn(tipo, valor){
    let ativo = filtros[tipo].includes(valor) ? "active" : "";
    return `<button class="${ativo}" onclick="toggle('${tipo}','${valor}',this)">${valor}</button>`;
}

function toggle(tipo,val,el){
    if(filtros[tipo].includes(val)){
        filtros[tipo] = filtros[tipo].filter(v=>v!==val);
    }else{
        filtros[tipo].push(val);
    }
    aplicar();
}

// ================= SELECIONAR TODOS
function selecionarTodos(tipo){
    if(tipo === 'mes'){
        let todosMeses = [...new Set(dados.map(d=>d.mes))].sort();
        filtros.mes = [...todosMeses];
    } else if(tipo === 'servidor'){
        let etiquetasSet = new Set();
        dados.forEach(d=>d.etiqueta.forEach(e=>etiquetasSet.add(e)));
        let todosServidores = [];
        [...etiquetasSet].forEach(e=>{
            if(e.toLowerCase().includes("servidor") || e.toLowerCase().includes("supervis")){
                todosServidores.push(e);
            }
        });
        filtros.etiqueta = [...todosServidores];
    }
    aplicar();
}

// ================= LIMPAR FILTRO ESPECÍFICO
function limparFiltroEspecifico(tipo){
    if(tipo === 'mes'){
        filtros.mes = [];
    } else if(tipo === 'servidor'){
        let etiquetasSet = new Set();
        dados.forEach(d=>d.etiqueta.forEach(e=>etiquetasSet.add(e)));
        let servidores = [];
        [...etiquetasSet].forEach(e=>{
            if(e.toLowerCase().includes("servidor") || e.toLowerCase().includes("supervis")){
                servidores.push(e);
            }
        });
        filtros.etiqueta = filtros.etiqueta.filter(e => !servidores.includes(e));
    }
    aplicar();
}

// ================= FILTRAR
function aplicar(){
    filtrados = dados.filter(d=>
        (!filtros.mes.length||filtros.mes.includes(d.mes)) &&
        (!filtros.orgao.length||filtros.orgao.includes(d.orgao)) &&
        (!filtros.assunto.length||filtros.assunto.includes(d.assunto)) &&
        (!filtros.reu.length||filtros.reu.includes(d.reu)) &&
        (!filtros.etiqueta.length||filtros.etiqueta.some(e=>d.etiqueta.includes(e)))
    );
    criarFiltros();
    render();
}

// ================= COLUNAS
function col(){
    return [c1.checked,c2.checked,c3.checked,c4.checked,c5.checked,c6.checked,c7.checked,c8.checked];
}

// ================= MARCAR LINHA (Ação Checkbox)
function marcarLinha(proc, el) {
    let item = dados.find(x => x.proc === proc);
    if(item) item._riscado = el.checked;
    
    let tr = el.closest('tr');
    tr.style.textDecoration = el.checked ? 'line-through' : 'none';
    tr.style.opacity = el.checked ? '0.6' : '1';
}

// ================= COPIAR PROCESSO
function copiarTexto(texto, el) {
    navigator.clipboard.writeText(texto).then(() => {
        let original = el.innerText;
        el.innerText = "✔️"; // Feedback visual temporário
        setTimeout(() => el.innerText = original, 1500);
    }).catch(err => {
        console.error("Erro ao copiar o processo: ", err);
    });
}

// ================= RENDER
function render(){
    document.getElementById("total").innerText = filtrados.length;
    let c = col();
    let head=["Processo","Autor","Réu","Órgão","Data","Assunto","Etiqueta","Dias"];

    document.querySelector("thead").innerHTML =
        "<tr><th style='width: 30px; text-align: center;'>✔</th>"+head.map((h,i)=>c[i]?`<th>${h}</th>`:"").join("")+"</tr>";

    document.querySelector("tbody").innerHTML =
        filtrados.map(d=>`
        <tr style="text-decoration: ${d._riscado ? 'line-through' : 'none'}; opacity: ${d._riscado ? '0.6' : '1'};">
            <td style='text-align: center;'>
                <input type="checkbox" ${d._riscado ? 'checked' : ''} onchange="marcarLinha('${d.proc}', this)">
            </td>
            ${c[0]?`<td>${d.proc} <span class="btn-copiar-proc" onclick="copiarTexto('${d.proc}', this)" title="Copiar número do processo">📋</span></td>`:""}
            ${c[1]?`<td>${d.autor}</td>`:""}
            ${c[2]?`<td>${d.reu}</td>`:""}
            ${c[3]?`<td>${d.orgao}</td>`:""}
            ${c[4]?`<td>${d.data}</td>`:""}
            ${c[5]?`<td>${d.assunto}</td>`:""}
            ${c[6]?`<td>${d.etiqueta.join(", ")}</td>`:""}
            ${c[7]?`<td>${d.dias}</td>`:""}
        </tr>
        `).join("");
}

// ================= EXPORTAR EXCEL
function exportarExcel(){
    if(filtrados.length === 0) return alert("Não há dados para exportar.");

    let dadosExcel = filtrados.map(d => {
        let row = {};
        let c = col();
        
        if(c[0]) row["Processo"] = d.proc;
        if(c[1]) row["Autor"] = d.autor;
        if(c[2]) row["Réu"] = d.reu;
        if(c[3]) row["Órgão"] = d.orgao;
        if(c[4]) row["Data"] = d.data;
        if(c[5]) row["Assunto"] = d.assunto;
        if(c[6]) row["Etiqueta"] = d.etiqueta.join(", ");
        if(c[7]) row["Dias"] = d.dias;
        
        return row;
    });

    let ws = XLSX.utils.json_to_sheet(dadosExcel);
    
    let colWidths = [];
    Object.keys(dadosExcel[0]).forEach(key => {
        let maxWidth = key.length;
        dadosExcel.forEach(row => {
            if(row[key] && row[key].length > maxWidth){
                maxWidth = row[key].length;
            }
        });
        colWidths.push({wch: Math.min(maxWidth + 2, 50)});
    });
    ws['!cols'] = colWidths;

    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Processos");

    let agora = new Date();
    let dia = String(agora.getDate()).padStart(2, '0');
    let mes = String(agora.getMonth() + 1).padStart(2, '0');
    let ano = agora.getFullYear();
    let hora = String(agora.getHours()).padStart(2, '0');
    let min = String(agora.getMinutes()).padStart(2, '0');
    let seg = String(agora.getSeconds()).padStart(2, '0');
    
    let nomeArquivo = `RELATORIO-TRIAGEM-CONTJEF-${dia}${mes}${ano}-${hora}${min}${seg}.xlsx`;

    XLSX.writeFile(wb, nomeArquivo);
}

// ================= JSON
function salvarJSON(){
    if(dados.length === 0) return alert("Não há dados para salvar.");

    let agora = new Date();
    let dia = String(agora.getDate()).padStart(2, '0');
    let mes = String(agora.getMonth() + 1).padStart(2, '0');
    let ano = agora.getFullYear();
    let hora = String(agora.getHours()).padStart(2, '0');
    let min = String(agora.getMinutes()).padStart(2, '0');
    let seg = String(agora.getSeconds()).padStart(2, '0');
    
    let nomeArquivo = `RELATORIO-TRIAGEM-CONTJEF-${dia}${mes}${ano}-${hora}${min}${seg}.json`;

    let blob=new Blob([JSON.stringify(dados)],{type:"application/json"});
    let a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=nomeArquivo;
    a.click();
}

function carregarJSON(){
    let input=document.createElement("input");
    input.type="file";
    input.accept=".json";
    input.onchange=e=>{
        let reader=new FileReader();
        reader.onload=ev=>{
            try {
                dados = JSON.parse(ev.target.result);
                filtros = {mes:[],orgao:[],etiqueta:[],assunto:[],reu:[]};
                aplicar();
            } catch (err) {
                alert("Erro ao ler o arquivo JSON.");
            }
        };
        reader.readAsText(e.target.files[0]);
    };
    input.click();
}

function gerarPDF(){
    if(filtrados.length === 0) return alert("Não há dados para gerar o PDF.");

    // ================= DATA + HORA
    let agora = new Date();

    let dia = String(agora.getDate()).padStart(2, '0');
    let mes = String(agora.getMonth() + 1).padStart(2, '0');
    let ano = agora.getFullYear();

    let hora = String(agora.getHours()).padStart(2, '0');
    let min = String(agora.getMinutes()).padStart(2, '0');
    let seg = String(agora.getSeconds()).padStart(2, '0');

    let dataHora = `${dia}/${mes}/${ano} ${hora}:${min}:${seg}`;

    // ================= NOME DO ARQUIVO (PDF)
    let nomeArquivo = `RELATORIO-TRIAGEM-CONTJEF-${dia}${mes}${ano}-${hora}${min}${seg}`;

    // ================= NUMERO DO RELATÓRIO
    let numeroRelatorio = `CONTJEFPE-TRI-${Date.now()}`; 

    // ================= TEXTO FILTROS
    let texto="<b>Filtros aplicados:</b><br>";

    if(filtros.mes.length) texto+="Mês: "+filtros.mes.join(", ")+"<br>";
    if(filtros.etiqueta.length) texto+="Etiquetas: "+filtros.etiqueta.join(", ")+"<br>";
    if(filtros.orgao.length) texto+="Órgão: "+filtros.orgao.join(", ")+"<br>";
    if(filtros.reu.length) texto+="Réu: "+filtros.reu.join(", ")+"<br>";
    if(filtros.assunto.length) texto+="Assunto: "+filtros.assunto.join(", ")+"<br>";
    if(!filtros.mes.length && !filtros.etiqueta.length && !filtros.orgao.length && !filtros.assunto.length && !filtros.reu.length) texto += "Nenhum (Todos os registros)<br>";

    // ================= HTML PDF
    let html = `
    <!DOCTYPE html>
    <html>
    <head>
        <title>${nomeArquivo}</title>
        <style>
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body{
            font-family:Arial, sans-serif;
            font-size: 12px; 
        }

        .header{
            display:flex;
            align-items:center;
            gap:10px;
            background:#1565c0;
            color:white;
            padding:10px;
        }

        .header h3 {
            font-size: 18px; 
            margin:0;
        }

        .header p {
            font-size: 14px; 
            margin:0;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top: 15px;
            font-size: 10px; 
        }

        th{
            background:#64b5f6 !important;
            color:white;
        }

        td,th{
            border:1px solid #ccc;
            padding: 8px; 
            text-align: left;
        }

        tr:nth-child(even){
            background:#f1f1f1 !important;
        }

        .footer{
            margin-top:20px;
            font-size:10px; 
            color: #555;
        }
        
        /* Oculta a coluna do checkbox no PDF */
        th:first-child, td:first-child { display: none; }
        
        /* Oculta o botão de copiar no PDF impresso para manter o visual limpo */
        .btn-copiar-proc { display: none !important; }
        </style>
    </head>
    <body>
        <div class="header">
            <div>
                <h3>Contadoria Judicial</h3>
                <p>Justiça Federal em Pernambuco</p>
            </div>
        </div>

        <h2>Relatório de Processos</h2>

        <p><b>Nº do Relatório:</b> ${numeroRelatorio}</p>

        <p>${texto}</p>

        ${document.querySelector("table").outerHTML}

        <div class="footer">
        Relatório emitido em: ${dataHora}<br><br>
        <b>Sistema desenvolvido para uso interno</b>
        </div>
    </body>
    </html>
    `;

    // ================= ABRIR E IMPRIMIR
    let win = window.open("", "_blank");
    win.document.write(html);
    win.document.close(); 
    
    win.document.title = nomeArquivo; 
    
    win.focus();
    
    setTimeout(() => {
        win.print();
    }, 250);

}

</script>

</body>
</html>
